services:
  hadoop:
    build: ./hadoop
    container_name: hadoop-nodo
    volumes:
      - ./ventas_125055192.csv:/data/input/ventas_125055192.csv:ro
      - ./mapreduce:/home/hadoop/mapreduce
      - ./scripts:/home/hadoop/scripts
    networks:
      - datamart-net

  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - datamart-net

  api:
    build: ./api
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "5000:5000"
    volumes:
      - ./scripts:/scripts
      - ./evidencias:/evidencias

    depends_on:
      - db
    networks:
      - datamart-net

volumes:
  pgdata:

networks:
  datamart-net:
